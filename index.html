function updateUI(){document.getElementById('coins').textContent=coins;document.getElementById('bagCount').textContent=bag.length;document.getElementById('capacity').textContent=capacity;document.getElementById('upgradeCost').textContent=upgradeCost;document.getElementById('items').textContent=bag.length?bag.map(x=>x.emoji+' '+x.name+' · '+x.value+'c').join(' | '):'Nothing collected yet.'}
window.sell=()=>{if(!bag.length)return toast('Bag is empty!');let n=bag.reduce((s,x)=>s+x.value,0);coins+=n;bag=[];updateUI();toast('Sold for '+n+' coins!')};window.upgrade=()=>{if(coins<upgradeCost)return toast('Not enough coins!');coins-=upgradeCost;capacity+=2;upgradeCost=Math.round(upgradeCost*1.7);updateUI();toast('Bag capacity increased!')};window.raid=()=>{if(coins<10)return toast('Need 10 coins to raid');coins-=10;if(Math.random()<.6&&bag.length<capacity){let d=catalog[Math.floor(Math.random()*catalog.length)];bag.push(d);toast('Raid success: '+d.name)}else toast('Raid failed!');updateUI()};
const target=new THREE.Vector3();function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,Math.max(.001,(t-(animate.last||t))/1000));animate.last=t;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+(-joy.y),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;let l=Math.hypot(f,s);if(l>.08){f/=Math.max(1,l);s/=Math.max(1,l);let dx=s*Math.cos(yaw)-f*Math.sin(yaw),dz=-s*Math.sin(yaw)-f*Math.cos(yaw);player.position.x+=dx*5*dt;player.position.z+=dz*5*dt;player.position.x=Math.max(-84,Math.min(84,player.position.x));player.position.z=Math.max(-84,Math.min(84,player.position.z));player.rotation.y=Math.atan2(dx,dz);walk+=t*.0008;legL.rotation.x=Math.sin(t*.012)*.65;legR.rotation.x=-Math.sin(t*.012)*.65;armL.rotation.x=-Math.sin(t*.012)*.42;armR.rotation.x=Math.sin(t*.012)*.42;player.position.y=.25+Math.abs(Math.sin(t*.012))*.07}else{legL.rotation.x*=.75;legR.rotation.x*=.75;armL.rotation.x*=.75;armR.rotation.x*=.75;player.position.y=.25+Math.sin(t*.002)*.015}
for(let i=loot.length-1;i>=0;i--){let q=loot[i];q.group.position.y=.35+Math.sin(t*.002+q.phase)*.12;q.group.rotation.y+=.01;let dx=player.position.x-q.group.position.x,dz=player.position.z-q.group.position.z;if(Math.hypot(dx,dz)<1.3){if(bag.length>=capacity){toast('Bag full — sell loot!');continue}bag.push(q.data);scene.remove(q.group);loot.splice(i,1);updateUI();toast('Collected '+q.data.name+'!');if(loot.length<8){let a=Math.random()*6.28,r=8+Math.random()*65;spawnOne(catalog[Math.floor(Math.random()*catalog.length)],Math.cos(a)*r,Math.sin(a)*r)}}}
target.set(player.position.x,player.position.y+1.4,player.position.z);let d=9;camera.position.set(target.x+Math.sin(yaw)*d,target.y+3+Math.sin(pitch)*d,target.z+Math.cos(yaw)*d);camera.lookAt(target);renderer.render(scene,camera)}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});updateUI();
</script></body></html>
